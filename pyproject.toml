[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-vl-grpo-reasoning"
version = "0.1.0"
description = "Chinese project for GRPO reasoning fine-tuning with Qwen-VL and TRL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.34.0",
  "datasets>=2.21.0",
  "huggingface_hub>=0.24.0",
  "peft>=0.12.0",
  "pillow>=10.0.0",
  "qwen-vl-utils>=0.0.8",
  "torch>=2.4.0",
  "transformers>=4.49.0",
  "trl>=1.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[project.scripts]
qwen-vl-grpo-train = "qwen_vl_grpo_reasoning.train:main"
qwen-vl-grpo-infer = "qwen_vl_grpo_reasoning.infer:main"
qwen-vl-grpo-eval = "qwen_vl_grpo_reasoning.evaluate:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
